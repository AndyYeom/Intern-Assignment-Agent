[project]
name = "intern-assignment-agent"
version = "0.1.0"
description = "NUS ISS hackathon: profile, catalog, evidence and matching agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi",
    # PDF conversion with the local layout model only (no OCR/Office formats).
    "docling-slim[convert-core,format-pdf,models-local]>=2.129.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openai>=1.66",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sqlalchemy>=2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[dependency-groups]
# Synthetic dataset tooling (generator/resume renders PDFs); not in the API image.
generator = [
    "weasyprint>=70.0",
]
dev = [
    "mypy",
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_catalog_agent = ["resources/*.json", "resources/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["real_data: reads the real data/ corpus instead of an isolated copy"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/project_catalog_agent/catalog/contracts/common.py" = ["UP042"]
"src/project_catalog_agent/catalog/contracts/taxonomy.py" = ["UP042"]
"src/project_catalog_agent/catalog/contracts/recovery.py" = ["UP042"]
"src/project_catalog_agent/catalog/contracts/state.py" = ["UP042"]
"src/project_catalog_agent/catalog/contracts/decision.py" = ["UP042"]
"src/project_catalog_agent/catalog/contracts/clarification_application.py" = ["UP042"]
"src/project_catalog_agent/admin/contracts.py" = ["UP042"]
"src/project_catalog_agent/admin/roles.py" = ["UP042"]
"src/project_catalog_agent/demo/scenarios.py" = ["UP042"]
"src/project_catalog_agent/persistence/contracts.py" = ["UP042"]
"src/project_catalog_agent/workflow/contracts.py" = ["UP042"]
"src/project_catalog_agent/extraction/quality.py" = ["UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
files = ["src"]

# Linux (the backend container on ECS) has no GPU: take CPU-only torch wheels
# instead of the default CUDA builds, which add several GB to the image.
[tool.uv]
default-groups = ["dev", "generator"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
